line-length = 120
target-version = "py312"
extend-exclude = ["_*", "docs", "datasets", "logs", "videos"]

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
ignore = [
    "E741",
    "B008",  # function-call-in-default-argument: Isaac Lab idiom, e.g. SceneEntityCfg("robot")
]

[lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/mdp/*.py" = ["F403", "F405"]
# Isaac Lab scripts must launch the simulator (AppLauncher) before importing the rest
"scripts/**" = ["E402", "E501"]
# @configclass reads class attributes off the class; ClassVar annotations would hide them
"**/config/**/*.py" = ["RUF012"]

[format]
docstring-code-format = true
